services:
  postgres:
    image: postgres:16-alpine
    container_name: aivora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aivora
      POSTGRES_USER: aivora
      POSTGRES_PASSWORD: aivora
    ports:
      - "15439:5432"
    volumes:
      - aivora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivora -d aivora"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: aivora-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - aivora_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: aivora-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: aivora
      MINIO_ROOT_PASSWORD: change-me
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - aivora_minio_data:/data
    command: server /data --console-address ":9001"

  flyway:
    image: flyway/flyway:latest
    container_name: aivora-flyway
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/aivora
      FLYWAY_USER: aivora
      FLYWAY_PASSWORD: aivora
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    command: migrate
    volumes:
      - ./backend/db/migrations:/flyway/sql:ro

  api:
    image: python:3.12-slim
    container_name: aivora-api
    working_dir: /workspace/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      flyway:
        condition: service_completed_successfully
    env_file:
      - backend/.env.local
    environment:
      PYTHONPATH: /workspace/backend
      DATABASE_URL: postgresql+asyncpg://aivora:aivora@postgres:5432/aivora
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      BYOK_REQUIRED: "true"
    volumes:
      - .:/workspace
    command: bash -lc "pip install -e . >/tmp/aivora-api-install.log && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "18000:8000"

  worker:
    image: python:3.12-slim
    container_name: aivora-worker
    working_dir: /workspace/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      flyway:
        condition: service_completed_successfully
    env_file:
      - backend/.env.local
    environment:
      PYTHONPATH: /workspace/backend
      DATABASE_URL: postgresql+asyncpg://aivora:aivora@postgres:5432/aivora
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      BYOK_REQUIRED: "true"
    volumes:
      - .:/workspace
    command: bash -lc "pip install -e . >/tmp/aivora-worker-install.log && celery -A app.workers.celery_app.celery_app worker --loglevel=INFO --pool=prefork --concurrency=4 --queues=aivora --hostname=aivora-worker@%h"

  web:
    image: node:22-alpine
    container_name: aivora-web
    working_dir: /workspace/web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:18000
    volumes:
      - .:/workspace
    command: sh -lc "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "13000:3000"

volumes:
  aivora_postgres_data:
  aivora_redis_data:
  aivora_minio_data:
