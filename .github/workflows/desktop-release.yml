name: Desktop Release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本标签，例如 desktop-v0.1.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: 构建 ${{ matrix.os }} 客户端
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建安装包
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.script }} -- --publish never

      - name: 上传平台安装包
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: apps/desktop/release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: 创建桌面端 Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有平台安装包
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 发布桌面端安装包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*

  publish-direct-downloads:
    name: 更新 OSS 直链下载
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有平台安装包
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 配置 ossutil
        uses: pascal-lab/setup-ossutil@v1
        with:
          endpoint: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          access-key-id: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}

      - name: 上传并覆盖 OSS 最新安装包
        env:
          OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
        run: |
          MAC_PACKAGE="$(find release-assets -type f -name '*.dmg' | head -n 1)"
          WINDOWS_PACKAGE="$(find release-assets -type f -name '*.exe' | head -n 1)"
          test -n "$MAC_PACKAGE"
          test -n "$WINDOWS_PACKAGE"
          ossutil cp -f "$MAC_PACKAGE" "oss://${OSS_BUCKET}/Aivora-latest.dmg"
          ossutil cp -f "$WINDOWS_PACKAGE" "oss://${OSS_BUCKET}/Aivora-latest.exe"
