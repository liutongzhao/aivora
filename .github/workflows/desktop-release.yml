name: Desktop Release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本标签，例如 desktop-v0.1.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: 构建 ${{ matrix.os }} 客户端
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建安装包
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.script }} -- --publish never

      - name: 上传平台安装包
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: apps/desktop/release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: 创建桌面端 Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有平台安装包
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 发布桌面端安装包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*

  publish-direct-downloads:
    name: 更新生产环境直链下载
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有平台安装包
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 配置 SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/aivora_deploy
          chmod 600 ~/.ssh/aivora_deploy
          ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 上传并原子替换 latest 安装包
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          MAC_PACKAGE="$(find release-assets -type f -name '*.dmg' | head -n 1)"
          WINDOWS_PACKAGE="$(find release-assets -type f -name '*.exe' | head -n 1)"
          test -n "$MAC_PACKAGE"
          test -n "$WINDOWS_PACKAGE"
          ssh -i ~/.ssh/aivora_deploy -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            'mkdir -p /home/ubuntu/service-deploy/downloads'
          scp -i ~/.ssh/aivora_deploy -P "${DEPLOY_PORT:-22}" "$MAC_PACKAGE" "$DEPLOY_USER@$DEPLOY_HOST:/home/ubuntu/service-deploy/downloads/Aivora-latest.dmg.tmp"
          scp -i ~/.ssh/aivora_deploy -P "${DEPLOY_PORT:-22}" "$WINDOWS_PACKAGE" "$DEPLOY_USER@$DEPLOY_HOST:/home/ubuntu/service-deploy/downloads/Aivora-latest.exe.tmp"
          ssh -i ~/.ssh/aivora_deploy -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            'mv /home/ubuntu/service-deploy/downloads/Aivora-latest.dmg.tmp /home/ubuntu/service-deploy/downloads/Aivora-latest.dmg && mv /home/ubuntu/service-deploy/downloads/Aivora-latest.exe.tmp /home/ubuntu/service-deploy/downloads/Aivora-latest.exe'
