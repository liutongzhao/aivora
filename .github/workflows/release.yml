name: Release

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "镜像版本；留空时使用当前提交 SHA"
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_SHA}}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "非法镜像版本" >&2
            exit 1
          fi
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./services/backend
          file: ./services/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aivora-backend:${{ steps.meta.outputs.image_tag }}
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: NEXT_PUBLIC_API_BASE_URL=
          tags: ghcr.io/${{ github.repository_owner }}/aivora-web:${{ steps.meta.outputs.image_tag }}

  deploy:
    needs: release
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload deployment files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/aivora_deploy
          chmod 600 ~/.ssh/aivora_deploy
          ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/aivora_deploy -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /home/ubuntu/service-deploy/nginx /home/ubuntu/service-deploy/scripts /home/ubuntu/service-deploy/migrations'
          scp -i ~/.ssh/aivora_deploy -P "${DEPLOY_PORT:-22}" deploy/compose.prod.yml deploy/nginx/default.conf "$DEPLOY_USER@$DEPLOY_HOST:/home/ubuntu/service-deploy/"
          scp -i ~/.ssh/aivora_deploy -P "${DEPLOY_PORT:-22}" deploy/scripts/*.sh "$DEPLOY_USER@$DEPLOY_HOST:/home/ubuntu/service-deploy/scripts/"
          scp -i ~/.ssh/aivora_deploy -P "${DEPLOY_PORT:-22}" services/backend/db/migrations/*.sql "$DEPLOY_USER@$DEPLOY_HOST:/home/ubuntu/service-deploy/migrations/"
          ssh -i ~/.ssh/aivora_deploy -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" 'mv /home/ubuntu/service-deploy/default.conf /home/ubuntu/service-deploy/nginx/default.conf'
      - name: Deploy immutable image tag
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE_TAG: ${{ needs.release.outputs.image_tag }}
        run: |
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/aivora_deploy
          chmod 600 ~/.ssh/aivora_deploy
          ssh -i ~/.ssh/aivora_deploy -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "/home/ubuntu/service-deploy/scripts/deploy.sh '$IMAGE_TAG'"
