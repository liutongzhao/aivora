name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install services/backend -r services/backend/requirements-dev.txt
      - name: 准备后端测试配置
        run: cp services/backend/.env.example services/backend/.env.local
      - name: 启动后端测试基础设施
        run: |
          docker compose -p aivora-ci --project-directory "$GITHUB_WORKSPACE" -f deploy/compose.dev.yml up -d --wait postgres redis minio
      - run: pytest -q
      - name: 清理后端测试基础设施
        if: always()
        run: docker compose -p aivora-ci --project-directory "$GITHUB_WORKSPACE" -f deploy/compose.dev.yml down -v || true

  production-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose --env-file deploy/.env.prod.example -f deploy/compose.prod.yml config --quiet
      - run: bash -n scripts/test-production-config.sh deploy/scripts/*.sh
      - run: ./scripts/test-production-config.sh
